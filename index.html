<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blake Simon | Portfolio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@400;700;800&display=swap" rel="stylesheet">
  </head>
  <body>
    <div class="blob-bg blob-1"></div>
    <div class="blob-bg blob-2"></div>
    
    <main class="container">
      <header class="hero">
        <h1 class="hero-title">Blake Simon</h1>
        <p class="hero-subtitle">GIS Analyst and Application Developer</p>
        <p class="hero-description">Exploring the intersection of GIS, AI, and spatial data.</p>
      </header>

      <section class="projects-section">
        <h2 class="section-title">Featured GIS Projects</h2>
        <div id="projects-grid" class="projects-grid">
          <!-- Projects will be injected here by main.js -->
        </div>
      </section>
    </main>
    <!-- Video Demo Modal -->
    <div id="video-modal" class="video-modal" aria-hidden="true">
      <div class="video-modal-backdrop" id="video-modal-backdrop"></div>
      <div class="video-modal-container">
        <button id="video-modal-close" class="video-modal-close" aria-label="Close modal">&times;</button>
        <h3 id="video-modal-title" class="video-modal-title">Stop Sign Detection & Tracking System</h3>
        <div class="video-wrapper">
          <video id="modal-video-player" controls playsinline preload="metadata"></video>
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
